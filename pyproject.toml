[project]
name = "rfqinbox"
version = "0.1.0"
description = "Reads Ridgeline's RFQ inbox: classifies each email and extracts self-contained line items."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rfqinbox = "rfqinbox.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
